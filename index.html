<style>
:root{--bg:#f4f5f9;--card:#fff;--ink:#1b2236;--mut:#6b7488;--line:#e3e6ee;--ac:#c2185b;--ac2:#0f8a7e;--warn:#d98200;--bad:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}

*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;padding-bottom:84px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:19px;margin:0;font-weight:800}header h1 b{color:var(--ac)}
main{padding:0 14px 20px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{border-radius:12px;padding:12px;background:var(--card);border:1px solid var(--line)}.kpi small{color:var(--mut)}.kpi b{display:block;font-size:18px;margin-top:2px}
.kpi.big{grid-column:1/3;background:var(--ac);color:#fff;border:0}.kpi.big small{color:#ffe3ee}.kpi.big b{font-size:26px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px}
label{display:block;font-size:12.5px;color:var(--mut);margin:10px 0 4px;font-weight:600}
button{border:0;border-radius:10px;padding:10px 14px;min-height:44px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}button.s{background:var(--ac2);color:#06231f}button.d{background:var(--bad)}
button.sm{min-height:36px;padding:6px 10px;font-size:13px}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;min-height:36px;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;font-weight:600;display:inline-block}
.t0{background:#e8eaf0;color:#444}.t1{background:#fff0d6;color:#8a5200}.t2{background:#d8f3ee;color:#07594f}.t3{background:#fde0e0;color:#8a1c1c}.tl{background:#d8f3ee;color:#07594f}.to{background:#fff0d6;color:#8a5200}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:1;background:none;color:var(--mut);font-size:12px;display:flex;flex-direction:column;gap:2px;align-items:center}nav button.on{color:var(--ac)}nav i{font-size:20px;font-style:normal}
.wa{background:#25d366;color:#fff;border-radius:50%;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-weight:800;font-size:13px}
a.mp{color:var(--ac2);font-weight:600;text-decoration:none}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));border-radius:99px;box-shadow:0 6px 18px #0004;z-index:6}
.modal{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94%;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.bars{display:flex;align-items:flex-end;gap:4px;height:130px;margin-top:8px}.bars div{flex:1;display:flex;gap:2px;align-items:flex-end;height:100%}.bars i{flex:1;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}.bars i.p{background:var(--mut);opacity:.5}
.lab{display:flex;gap:4px;font-size:10px;color:var(--mut)}.lab span{flex:1;text-align:center}
.bb{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600}.b1{background:#3b82f633;color:#3b82f6}.b2{background:#e08a0033;color:#e08a00}.b3{background:#8b5cf633;color:#8b5cf6}.b4{background:#10a37f33;color:#10a37f}.b5{background:#d6336c33;color:#d6336c}.b6{background:var(--line);color:var(--mut)}
.swr{position:relative;margin-bottom:12px}.swr .card{margin:0;position:relative;z-index:1;transition:transform .2s}.swa{position:absolute;right:0;top:0;bottom:0;display:flex;gap:6px;align-items:center;padding-right:8px}.swr.open .card{transform:translateX(-150px)}

:root[data-theme="dark"] input::-webkit-calendar-picker-indicator{filter:brightness(0) invert(1)}
.card{font-size:14px}.kpi small{font-size:12px}.kpi b{font-size:17px}.grid,.tiles{gap:10px}input,select,textarea{font-size:14px}.hb b{font-size:13px}.tile b{font-size:15px}
.pc{flex:1 1 auto;min-width:0;white-space:nowrap;text-align:center;padding:6px 4px;font-size:11.5px;display:flex;align-items:center;justify-content:center}
:root{--bg:#f5faff;--card:#ffffff;--ink:#12304d;--mut:#64809b;--line:#d9e8f6;--ac:#0b84d6;--ac2:#f5b700;--ok:#0e9f6e;--warn:#e08a00;--bad:#d03a3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1624;--card:#12243a;--ink:#e8f3ff;--mut:#8fa8c2;--line:#223a55;--ac:#38bdf8;--ac2:#fbbf24;--ok:#34d399;--warn:#f59e0b;--bad:#f87171}#app button:not(.g):not(.d):not(.s),.modal button:not(.g):not(.d):not(.s),:root:not([data-theme="light"]) .chip.on{color:#06233a}}
:root[data-theme="dark"]{--bg:#0b1624;--card:#12243a;--ink:#e8f3ff;--mut:#8fa8c2;--line:#223a55;--ac:#38bdf8;--ac2:#fbbf24;--ok:#34d399;--warn:#f59e0b;--bad:#f87171}
:root[data-theme="dark"] #app button:not(.g):not(.d):not(.s),:root[data-theme="dark"] .modal button:not(.g):not(.d):not(.s),:root[data-theme="dark"] .chip.on{color:#06233a}
.pos{color:var(--ok)}a.mp{color:var(--ac)}.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}button.s{background:var(--ac2);color:#3b2a00}.kpi.big{background:var(--ac)}
.b1{background:#0b84d633;color:#0b84d6}.b2{background:#f5b70044;color:#9a6b00}.b3{background:#38bdf833;color:#0a6fb0}.b4{background:#0e9f6e33;color:#0e9f6e}.b5{background:#f5b70033;color:#a37000}
.card{box-shadow:0 1px 3px #0b84d60d}nav{box-shadow:0 -2px 12px #0b84d61a}
.vlist{position:absolute;left:0;right:0;top:100%;margin-top:4px;max-height:230px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;z-index:15;box-shadow:0 6px 18px #0b84d626}.vi{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}.vi:last-child{border-bottom:0}
.btnl{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-height:36px;font-size:13px;font-weight:600;cursor:pointer}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.tile{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}.tile .ti{font-size:22px;line-height:1.1}.tile b{font-size:15px}.tile small{color:var(--mut);font-size:12px}
.hb>span.w{width:122px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.hb{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}.hb>span{width:62px;color:var(--mut)}.hb>div{flex:1;background:var(--line);border-radius:6px;height:14px;overflow:hidden}.hb i{display:block;height:100%;background:var(--ac2);border-radius:6px}.hb b{min-width:96px;text-align:right}
.photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.photos img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.sum{background:var(--card);border:1px dashed var(--ac2);border-radius:12px;padding:10px;margin-top:12px;font-size:13.5px}.sum div{display:flex;justify-content:space-between}
.mut{color:var(--mut);font-size:13px}.pos{color:var(--ac2)}.neg{color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;max-width:90%}
</style></head><body>
<header><h1>SS <b>Delivery</b> Tracker</h1><span class="row" style="gap:6px;flex-wrap:nowrap"><button class="g sm" onclick="bkOpen()">Backup</button><button class="g sm" onclick="toggleTheme()">Tema</button></span></header>
<main id="app"></main>
<nav><button data-v="dash" onclick="go('dash')"><i>▦</i>Dashboard</button><button data-v="order" onclick="go('order')"><i>🚗</i>Order</button><button data-v="trip" onclick="go('trip')"><i>🧭</i>Trip</button><button data-v="aging" onclick="go('aging')"><i>⏳</i>Aging</button><button data-v="vendor" onclick="go('vendor')"><i>🏪</i>Vendor</button></nav>
<script>
const SEED=[];
let DB={vendors:[],orders:[],theme:""},V="dash",F=null,VF=null,R="month",P="month",CMP=false;
const TKEY="ssdt_test",TSRC="ssdt";let PEND=false;
try{const _r=localStorage.getItem(TKEY);if(_r!=null)DB=JSON.parse(_r)||DB;else if(localStorage.getItem(TSRC)!=null)PEND=true}catch(e){}
if(!DB.vendors.length&&!PEND){DB.vendors=SEED.map((s,i)=>({id:"v"+i,nama:s[0],pic:s[1],tel:s[2],alamat:s[3],rate:s[4],map:s[5],mapMode:"link"}));save()}
var SAVEFAIL=false;
function save(){if(PEND)return;try{localStorage.setItem(TKEY,JSON.stringify(DB));SAVEFAIL=false}catch(e){toast("⚠️ GAGAL menyimpan: perubahan terakhir BELUM tersimpan");if(!SAVEFAIL){SAVEFAIL=true;try{saveFailAlert()}catch(_){}}}}
function saveFailAlert(){if(document.getElementById('sfa'))return;var d=document.createElement("div");d.className="modal";d.id="sfa";d.style.zIndex=60;d.style.alignItems="center";d.innerHTML='<div class="card" style="max-width:360px;margin:16px;border:2px solid var(--bad)"><b style="color:var(--bad)">⚠️ Penyimpanan penuh</b><p style="margin:8px 0">Perubahan terakhir <b>belum tersimpan</b> dan bisa hilang saat halaman ditutup / di-reload. Amankan sekarang dengan download backup.</p><div class="row"><button class="s" onclick="try{bkDl()}catch(e){}">Download backup sekarang</button><button class="g" onclick="var m=document.getElementById(\'sfa\');if(m)m.remove()">Nanti</button></div></div>';document.body.appendChild(d)}
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rp=n=>"Rp "+Math.round(n||0).toLocaleString("id-ID"),num=v=>parseFloat(v)||0,uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const wa=t=>{let d=String(t||"").replace(/\D/g,"");if(d.startsWith("0"))d="62"+d.slice(1);return d?"https://wa.me/"+d:""};
const mapL=(a,c)=>{const u=((String(c||'').match(/https?:\/\/\S+/)||[])[0]||'').replace(/[)\].,;]+$/,'');if(u)return u;const cc=ll(c);return "https://www.google.com/maps/search/?api=1&query="+(cc?cc.join(','):encodeURIComponent(a||""))};
const waBtn=(t,n)=>wa(t)?`<a class="wa" href="${wa(t)}" target="_blank" aria-label="WhatsApp ${n||""}">WA${n||""}</a>`:"";
const vend=id=>DB.vendors.find(v=>v.id==id);
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function toggleTheme(){const d=getComputedStyle(document.body).colorScheme==="dark"||document.documentElement.dataset.theme==="dark";document.documentElement.dataset.theme=d?"light":"dark";DB.theme=document.documentElement.dataset.theme;save()}
if(DB.theme)document.documentElement.dataset.theme=DB.theme;
/* ---------- calc: definisi tunggal "calc=function" ada di bawah ---------- */
/* ---------- nav ---------- */
function go(v){V=v;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v==v));render()}
function render(){const a=$("#app");a.innerHTML=V=="dash"?dash():V=="order"?orderList():V=="trip"?tripView3():V=="aging"?agingView():vendorList();document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v==V))}
/* ---------- vendor ---------- */
function vendorList(){return picCard()+`<input placeholder="Cari vendor…" oninput="vq=this.value;rv()" value="${esc(window.vq||"")}"><div class="row sp" style="margin:10px 0 0"><b id="vc">${vcTxt()}</b><span class="row"><button class="g sm" onclick="cpAll()">Salin daftar</button><button class="g sm" onclick="vDl()">Download .txt</button></span></div><div class="row" style="margin:8px 0 0"><button class="g sm" onclick="vImpOpen()">Tambah dari Text</button></div><div id="vl" style="margin-top:10px">${vl()}</div><button class="fab" onclick="editV()">+ Vendor</button>`}
function rv(){$("#vl").innerHTML=vl();$("#vc").textContent=vcTxt()}
function vl(){return vSearch().map(v=>`<div class="swr"><div class="swa"><button class="sm" onclick="editV('${v.id}')">Edit</button><button class="d sm" onclick="delV('${v.id}')">Hapus</button></div><div class="card" style="cursor:pointer" ontouchstart="swS(event)" ontouchend="swE(event,this)" onclick="if(!event.target.closest('a,button,select,input'))editV('${v.id}')"><div class="row sp"><b>${esc(v.nama)}</b>${waBtn(v.tel)}</div>
<div class="mut">${v.pic?"PIC: "+esc(v.pic)+" · ":""}${esc(v.tel)||"Telp: -"} · ${rp(v.rate)}/km</div>
<div style="margin:6px 0"><a class="mp" href="${esc(vmapUrl(v))}" target="_blank">📍 ${esc(v.alamat)}</a></div>
<div class="row"><button class="g sm" onclick="cpV('${v.id}')">Salin</button><button class="g sm" onclick="editV('${v.id}')">Ubah</button><button class="g sm" onclick="delV('${v.id}')">Hapus</button></div></div></div>`).join("")||'<p class="mut">Belum ada vendor.</p>'}
function editV(id){VF=id?{...vend(id)}:{id:uid(),nama:"",pic:"",tel:"",alamat:"",rate:5000,map:"",mapMode:"link",isNew:1};vmodal()}
function vmodal(){const v=VF;modal(`<h3>${v.isNew?"Vendor baru":"Ubah vendor"}</h3>
<label>Nama vendor</label><input value="${esc(v.nama)}" oninput="VF.nama=tc(this)">
<label>Nama PIC</label><input value="${esc(v.pic)}" oninput="VF.pic=this.value">
<label>No. HP / WhatsApp</label><input inputmode="tel" value="${esc(v.tel)}" oninput="VF.tel=this.value">
<label>Alamat lengkap</label><textarea oninput="VF.alamat=this.value">${esc(v.alamat)}</textarea>
<label>Tarif per KM <span class="mut">(perubahan hanya berlaku untuk order baru)</span></label><div class="row">${[0,5000,6250,7000].map(r=>`<span class="chip ${v.rate==r?"on":""}" onclick="VF.rate=${r};vmodal()">${r?rp(r):"Rp 0"}</span>`).join("")}</div><input type="number" inputmode="numeric" value="${v.rate}" oninput="VF.rate=num(this.value)" style="margin-top:6px">
<label>Sumber map</label><div class="row"><span class="chip ${v.mapMode=="link"?"on":""}" onclick="VF.mapMode='link';vmodal()">Link Google Maps</span><span class="chip ${v.mapMode=="auto"?"on":""}" onclick="VF.mapMode='auto';vmodal()">Otomatis dari alamat</span></div>
${v.mapMode=="link"?`<input placeholder="https://maps.app.goo.gl/…" value="${esc(v.map)}" oninput="VF.map=this.value" style="margin-top:6px">`:""}
<div class="row" style="margin-top:14px"><button onclick="saveV()">Simpan</button><button class="g" onclick="closeM()">Batal</button></div>`)}
function saveV(){if(!VF.nama.trim())return toast("Nama vendor wajib diisi");const i=DB.vendors.findIndex(x=>x.id==VF.id),o={...VF};delete o.isNew;i<0?DB.vendors.push(o):DB.vendors[i]=o;save();closeM();render()}
function delV(id){if(DB.orders.some(o=>o.vid==id))return toast("Vendor masih dipakai di order");askC("Hapus vendor ini?",()=>{DB.vendors=DB.vendors.filter(v=>v.id!=id);save();render()})}
/* ---------- order list ---------- */
const ST=["Belum Dikirim","Terkirim","Cancel"],STC=["t0","t2","t3"];
function orderList(){const vn=o=>vend(o.vid)?.nama||"",tk=o=>o.tgl+(o.jAntar||o.jPick||""),L=[...DB.orders].sort(OS=="old"?(a,b)=>tk(a).localeCompare(tk(b)):OS=="va"?(a,b)=>vn(a).localeCompare(vn(b),"id")||tk(b).localeCompare(tk(a)):OS=="vz"?(a,b)=>vn(b).localeCompare(vn(a),"id")||tk(b).localeCompare(tk(a)):(a,b)=>tk(b).localeCompare(tk(a)));

 return `<h3 style="margin:18px 0 4px">Smart Learning</h3><p class="mut" style="margin:0 0 6px">${LRN.ex.length} contoh koreksi \u00b7 ${LRN.rules.length} aturan aktif \u00b7 ${LRN.cand.length} menunggu bukti (butuh min. 2 order berbeda)</p>${r}<div class="row"><button class="g sm" onclick="lrnToggle()">${LRN.on?'Nonaktifkan':'Aktifkan'} learning</button><button class="g sm" onclick="lrnReset()">Reset learning</button></div>`}

const GSRE=/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/;

function gsSaveUrl(){const u=(($('#gsu')||{}).value||'').trim(),v=(($('#gsv')||{}).value||'').trim();if(u&&!GSRE.test(u))return toast('URL Web App harus …/macros/s/…/exec');if(v&&!/^https:\/\/docs\.google\.com\/spreadsheets\//.test(v))return toast('Link Sheet harus docs.google.com/spreadsheets/…');DB.gsheet=u;DB.gsheetView=v;save();toast('Tersimpan')}
function gsOpen(){const v=((($('#gsv')||{}).value)||DB.gsheetView||'').trim();if(!v)return toast('Isi & simpan link Google Sheet dulu');window.open(v,'_blank','noopener')}
function gsSend(){const el=$('#gsu'),url=((el?el.value:'')||DB.gsheet||'').trim();if(!url)return toast('Isi URL Google Sheets dulu');if(!GSRE.test(url))return toast('URL harus …/macros/s/…/exec');if(el&&url!=DB.gsheet){DB.gsheet=url;save()}if(!DB.orders.length)return toast('Belum ada order untuk dikirim');toast('Mengirim ke Google Sheets…');
 fetch(url,{method:'POST',body:JSON.stringify(gsPayload()),headers:{'Content-Type':'text/plain;charset=utf-8'}}).then(r=>r.text()).then(t=>{let j=null;try{j=JSON.parse(t)}catch(e){}
  DB.gsAt=new Date().toISOString();try{localStorage.setItem(TKEY,JSON.stringify(DB))}catch(e){}
  if(j&&j.ok)toast('✅ Terkirim ke Google Sheets ('+(j.orders||0)+' order)');else toast('✅ Terkirim — silakan cek Google Sheet-mu');
  const p=$('#gsat');if(p)p.textContent='Terakhir terkirim: '+new Date(DB.gsAt).toLocaleString('id-ID')}).catch(e=>toast('⚠️ Gagal kirim. Cek koneksi internet & URL.'))}
function gsPanel(){const at=DB.gsAt?new Date(DB.gsAt).toLocaleString('id-ID'):'belum pernah',f=DB.gsAuto||'off',lab={off:'Mati',daily:'Harian',weekly:'Mingguan',monthly:'Bulanan'},due=gsDue(),ch=k=>'<span class="chip '+(f==k?'on':'')+'" onclick="gsSetAuto(\''+k+'\')">'+lab[k]+'</span>';
 return '<h3 style="margin:18px 0 4px">Backup ke Google Sheets</h3><p class="mut" style="margin:0 0 6px">Kirim cadangan ke Google Sheet-mu (tabel rapi + data untuk restore). Link hanya tersimpan di HP ini.</p>'
 +'<label>URL Web App (…/exec) — untuk kirim data</label><input id="gsu" inputmode="url" value="'+esc(DB.gsheet||'')+'" placeholder="https://script.google.com/macros/s/…/exec">'
 +'<label>Link Google Sheet — untuk tombol Buka</label><input id="gsv" inputmode="url" value="'+esc(DB.gsheetView||'')+'" placeholder="https://docs.google.com/spreadsheets/…">'
 +'<div class="row" style="margin-top:8px"><button class="g sm" onclick="gsSaveUrl()">Simpan</button><button class="s sm" onclick="gsSend()">Kirim sekarang</button><button class="g sm" onclick="gsOpen()">📊 Buka Sheet</button></div>'
 +'<label style="margin-top:10px">Backup otomatis (saat aplikasi dibuka)</label><div class="row">'+ch('off')+ch('daily')+ch('weekly')+ch('monthly')+'</div>'
 +'<p class="mut" id="gsat" style="margin-top:6px">Backup terakhir: '+at+(f!='off'?' · '+(due?'<span style="color:var(--warn)">⚠️ waktunya backup</span>':'<span style="color:var(--ac2)">✅ '+lab[f].toLowerCase()+' up-to-date</span>'):'')+'</p>'
 +'<p class="mut" style="font-size:12px">Backup otomatis hanya jalan saat aplikasi dibuka &amp; ada internet. Kalau app tidak dibuka, tidak ada backup di periode itu.</p>'}

/* ===================== Tahap B: indikator data belum lengkap ===================== */
function chkIssues(){const t=today(),out=[];DB.orders.forEach(o=>{if(o.status=='Cancel')return;const p=[];
 if(!o.vid||!vend(o.vid))p.push('vendor belum dipilih');
 if(!(o.drops||[]).length||(o.drops||[]).some(d=>!(d.alamat||'').trim()))p.push('alamat penerima kosong');
 if(o.status=='Terkirim'&&!(num(o.nom)>0))p.push('Gross belum diisi');
 if(o.status=='Terkirim'&&dayAlloc(o.tgl).miss)p.push('Actual KM belum · profit sementara');
 if(o.status=='Belum Dikirim'&&o.tgl<t)p.push('status belum diupdate (tanggal sudah lewat)');
 if(p.length)out.push({o,p})});
 return out.sort((a,b)=>String(b.o.tgl).localeCompare(String(a.o.tgl)))}
function chkPanel(){const L=chkIssues();if(!L.length)return '<div class="card" style="border-left:5px solid var(--ac2)"><b>✅ Semua order lengkap</b><div class="mut">Tidak ada data yang perlu diperiksa.</div></div>';
 return '<details class="card" style="border-left:5px solid var(--warn)"><summary style="cursor:pointer;font-weight:800;list-style:none">⚠️ Perlu diperiksa ('+L.length+' order) — ketuk untuk lihat</summary><div style="margin-top:8px">'+L.map((x,i)=>{const o=x.o,v=vend(o.vid);return '<div class="row sp" style="border-top:1px solid var(--line);padding:6px 0;align-items:flex-start"><span style="flex:1;min-width:0"><b>'+(i+1)+'. '+esc(v?v.nama:'(tanpa vendor)')+'</b> <span class="mut">'+fmtD(o.tgl)+' · '+esc((o.drops&&o.drops[0]&&o.drops[0].nama)||'-')+'</span><br>'+x.p.map(s=>'<span class="bb b2" style="margin:3px 3px 0 0;display:inline-block">'+s+'</span>').join('')+'</span><button class="g sm" style="flex:none" onclick="editO(\''+o.id+'\')">Buka</button></div>'}).join('')+'</div></details>'}
const _rnChk=render;render=function(){_rnChk();if(V=='dash'){const a=$('#app');if(a)a.insertAdjacentHTML('afterbegin',chkPanel())}};
